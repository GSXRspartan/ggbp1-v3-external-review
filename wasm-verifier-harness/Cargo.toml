[package]
name = "ggbp1-v2-historical-wasm-verifier-harness"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "MIT"
publish = false
description = "Historical GGBP1R v2 verifier-only WASM archive; v3 is the reviewed default"

[lib]
crate-type = ["cdylib"]

[dependencies]
getrandom = { version = "=0.4.3", features = ["wasm_js"] }
ggbp1-v2-historical = { path = ".." }
wasm-bindgen = "=0.2.108"
